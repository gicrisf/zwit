# The URL the site will be built for
base_url = "https://zwit.link"

title = "Zwit"
description = "Giovanni Crisalfi's blog about code, tools, and the occasional weekend project."

default_language = "en"

generate_feeds = true
feed_filenames = ["atom.xml"]

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

theme = "mono"

taxonomies = [
  {name = "tags"},
  {name = "categories"},
]

build_search_index = false

[markdown]
insert_anchor_links = "right"
bottom_footnotes = true

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-light"

[extra]
logo_text = "Home"
logo_home_link = "/"
background_image = "bg.jpg"

# Collapse the navigation into the Menu toggle at every width.
compact_nav = true

# `section` marks the entry as current when the path starts with its URL.
main_menu = [
  {url = "/posts/", name = "posts", section = "posts"},
  {url = "/categories/", name = "categories", section = "categories"},
  {url = "/tags/", name = "tags", section = "tags"},
  {url = "atom.xml", name = "feed", trailing_slash = false},
]

github_url = "https://github.com/gicrisf"

favicon = "logo/favicon.ico"
apple_touch_icon = "logo/apple-touch-icon.png"

# Optional custom CSS placed in static/.
custom_css = "custom.css"

[[extra.background_image_animated]]
media = "(max-width: 640px)"
srcset = [
  { src = "bg-grain-384.webp", width = 384 },
]

[[extra.background_image_animated]]
media = "(max-width: 768px)"
srcset = [
  { src = "bg-grain-384.webp", width = 384 },
  { src = "bg-grain-640.webp", width = 640 },
]

[[extra.background_image_animated]]
media = "(max-width: 1024px)"
srcset = [
  { src = "bg-grain-384.webp", width = 384 },
  { src = "bg-grain-768.webp", width = 768 },
]

[[extra.background_image_animated]]
srcset = [
  { src = "bg-grain-384.webp", width = 384 },
  { src = "bg-grain-1024.webp", width = 1024 },
]

