<div style="width:1200px;height:630px;position:absolute;top:0;left:0;background-color:#ececec;background-image:url('$background');background-size:cover;background-position:center;display:flex;font-family:'IBM Plex Mono',monospace;color:#000000">
  <div style="position:absolute;top:0;left:0;right:0;bottom:0;background-color:rgba(236,236,236,0.62)"></div>
  <div style="display:flex;flex:1;padding:44px;position:relative;box-sizing:border-box">
    <div style="background-color:#ffffff;border:1px solid #c8c8c8;box-shadow:4px 4px 0 #a3a3a3;display:flex;flex:1;flex-direction:column;padding:56px;box-sizing:border-box">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:24px">
        <div style="display:flex;align-items:center;gap:16px">
          <div style="width:64px;height:64px;background-color:#ffffff;border:2px solid #000000;box-shadow:4px 4px 0 #a3a3a3;display:flex;align-items:center;justify-content:center;box-sizing:border-box">
            <img src="$logo" width="42" height="42">
          </div>
          <span style="font-size:36px;font-weight:700;letter-spacing:-1px">Zwit</span>
        </div>
        $label
      </div>
      <div style="display:flex;flex:1;flex-direction:column;gap:20px;justify-content:center">
        <div style="font-size:${title_size}px;font-weight:700;letter-spacing:-2px;line-height:1.05;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-overflow:ellipsis">$title</div>
        <div style="color:#4d4d4d;font-size:30px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;text-overflow:ellipsis">$description</div>
      </div>
      <div style="border-top:3px dotted #000000;color:#4d4d4d;display:flex;font-size:22px;font-weight:500;justify-content:space-between;padding-top:18px">
        <span>zwit.link</span>
        <span>$footer</span>
      </div>
    </div>
  </div>
</div>
